[build-system]
requires = ["setuptools>=80.9.0", "wheel==0.45.1", "setuptools_scm==8.3.1"]
build-backend = "setuptools.build_meta"

[project]
name = "nerb"
description = "NERB"
authors = [
    { name = "Patrick Nairne" },
    { name = "Jing Chen" },
    { name = "Peter Hansen" },
]
requires-python = ">=3.10"
dynamic = ["dependencies", "version"]
license = { file = "LICENSE" }
readme = "README.md"

[project.urls]
homepage = "https://github.com/P2GX/NERB"

[project.optional-dependencies]
test=[]

[tool.setuptools.dynamic.optional-dependencies]
test = {file = ["requirements/requirements_test.txt"]}

[tool.setuptools]
packages.find = { where = ["src"] }

[tool.setuptools_scm]
version_file = "src/nerb/_version.py"

[tool.setuptools.dynamic]
version = { attr = "nerb._version.version" }
dependencies = {file = ["requirements/requirements.txt"]}
